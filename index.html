    :root {
      /* The whole interface is laid out ONCE at this fixed "design" size and then uniformly
         scaled (CSS zoom, set by JS) so it always fits the viewport with no layout reflow --
         tabs, content, bevel and panels stay perfectly in proportion at every size. */
      --bevel: 9px;         /* bevel thickness (design px)              */
      --tab-h: 30px;        /* tab bar height                          */
      --tab-font: 13px;     /* tab label size                          */
      --tab-padx: 13px;
      --tab-gap: 3px;
      --ctl-w: 520px;       /* shared width of every control group      */
      /* palette: SELECTED tab is the light one (white label); panels share its light face */
      --surface: #1f1f1f;
      --game-bg: #000000;
      --sel-bg:  #545454;
      --sel-ink: #ffffff;
      --unsel-bg:#2c2c2c;
      --unsel-ink:#8c8c8c;
      --panel-dim:#dcdcdc;
      --panel-rule:#767676;
      --silk: 'Silk', ui-monospace, 'DejaVu Sans Mono', monospace;
    }

    html, body { margin:0; height:100%; background:var(--surface); overflow:hidden; }

    /* Stage: fills the viewport and centers the cabinet.  The cabinet is scaled with `zoom`
       (which re-rasterizes -> crisp text and crisp pixelated canvas) so the whole cabinet
       scales as one piece. */
    #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
             overflow:hidden; }
    #cabinet { position:relative; box-sizing:content-box; padding:var(--bevel);
               display:flex; flex-direction:column; align-items:flex-start; }
    body.toosmall #stage { display:none; }

    /* The sunken bevel wraps the tabs+content L-shape.  It is a child of #cabinet drawn in the
       cabinet's own (design) coordinates, so `zoom` scales it too. */
    #bevel { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }

    /* Tab bar: sits above the content and forms the top of the L-shape. */
    #tabbar { display:none; }
    .tab {
      font-family:var(--silk); font-weight:400; font-size:var(--tab-font);
      height:var(--tab-h); line-height:var(--tab-h); padding:0 var(--tab-padx);
      border:0; margin:0; outline:none; white-space:nowrap;
      background:var(--unsel-bg); color:var(--unsel-ink);
      cursor:pointer; user-select:none; transition:background .08s, color .08s;
    }
    .tab:not(.active):not(.disabled):hover { color:#b8b8b8; background:#3a3a3a; }
    .tab.disabled { background:#242424; color:#4c4c4c; cursor:default; }
    .tab.active   { background:var(--sel-bg); color:var(--sel-ink); cursor:default; }

    /* Content: fixed design size (game canvas at 2x = 640x400).  Panels overlay
       it.  A query container, so the Options panel can shrink to fit the narrow
       cabinet aspect ratios (the mod resizes this box; see the @container rules
       below). */
    #content { position:relative; z-index:2; width:640px; height:400px; background:var(--game-bg);
               display:flex; align-items:center; justify-content:center; overflow:hidden;
               container-type:inline-size; }
    #screen  { width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges;
               background:#000; display:block; }

    .panel {
      position:absolute; inset:0; overflow:hidden; box-sizing:border-box;
      background:var(--sel-bg); color:var(--sel-ink);
      font-family:var(--silk); font-weight:400; font-size:11px; line-height:1.35;
      padding:16px 18px 9px;
    }
    .panel.hidden { display:none !important; }
    .panel h3 { font-family:var(--silk); font-weight:400; color:#fff; font-size:11px; letter-spacing:1px;
                margin:0 0 6px; padding-bottom:2px; border-bottom:1px solid var(--panel-rule); }
    /* Sections: a little breathing room above each header (except the first).
       Kept small so no panel ever needs to scroll at any cabinet aspect. */
    .panel .sec { margin:0; max-width:520px; }
    /* Same gap from each heading divider to its first text/button. */
    .panel .sec p { margin:0 0 6px; }
    .panel .sec + .sec { margin-top:22px; } /* landscape & portrait */
    /* The square ratio has less vertical room, so it keeps a smaller gap. */
    #content[data-aspect="square"] .panel .sec + .sec { margin-top:18px; }
    /* Button groups that must always stay in one side-by-side row at every
       cabinet aspect: the recording/playback buttons, the aspect-ratio buttons,
       and the game-data/memory buttons (so they never wrap or re-grid). */
    .panel .ctl.rec-row, .panel .ctl.aspect-row, .panel .ctl.datamem-row {
      width:100%; max-width:520px; display:flex; gap:6px;
    }
    .panel .ctl.rec-row .obtn, .panel .ctl.aspect-row .obtn,
    .panel .ctl.datamem-row .obtn {
      flex:1 1 0; min-width:0; text-align:center;
      padding-left:4px; padding-right:4px; overflow:hidden; text-overflow:ellipsis;
    }
    .panel b { color:#fff; font-weight:400; }
    .panel .muted { color:var(--panel-dim); }
    /* Controls list: two columns, tight vertical rhythm. */
    .panel .controls-grid { display:grid; grid-auto-flow:column; grid-template-rows:repeat(6,auto);
                            grid-template-columns:1fr 1fr; column-gap:22px; row-gap:0; }
    .panel .krow { display:grid; grid-template-columns:78px 1fr; gap:8px; align-items:baseline; }
    .panel .keys { color:#fff; white-space:nowrap; }
    /* Keyboard keys referenced in the panels get a soft PlayStation-RPG pastel
       yellow; the " / ", " + " and " - " separators keep the normal colour. */
    .panel .key { color:#f6dd56; }

    /* Every control group is exactly --ctl-w wide so the two full-width buttons
       and the speed row all line up to the same width. */
    .panel .ctl { width:var(--ctl-w); max-width:100%; box-sizing:border-box; margin:0; }
    .panel .ctl.speed { display:flex; gap:8px; align-items:center; }
    /* Two dash-fills flank the number, each flex:1 so they stay equal and always
       reach the -/+ buttons at any panel width; the overflow is clipped. */
    .panel .ctl.speed .spd-fill { flex:1 1 0; min-width:0; overflow:hidden;
                                  white-space:nowrap; color:#fff; }
    .panel .ctl.speed .spd-num { flex:0 0 auto; text-align:center; color:#fff;
                                 white-space:nowrap; }
    .panel .ctl.sound { display:flex; gap:6px; }
    .panel .ctl.sound .obtn { flex:1 1 0; padding-left:4px; padding-right:4px; }

    /* Buttons on the light panel: recessed dark keys; never wrap. */
    .obtn {
      font-family:var(--silk); font-weight:400; font-size:12px; white-space:nowrap;
      background:#2f2f2f; color:#fff; border:1px solid #1c1c1c;
      padding:4px 12px; cursor:pointer; user-select:none;
    }
    .obtn.full { width:100%; box-sizing:border-box; text-align:center; }
    .obtn:hover { background:#242424; border-color:#000; }
    .obtn:disabled { color:#6a6a6a; cursor:default; }
    .obtn:disabled:hover { background:#2f2f2f; border-color:#1c1c1c; }
    /* Keep the pointer cursor over the whole clickable control, label included.
       Any child node (icon, SVG, span) inherits the cursor and does not capture
       the pointer, so it never reverts to the default over them. */
    .tab *, .obtn * {
      cursor:inherit; pointer-events:none;
    }
    .obtn.on { background:#ededed; color:#000; border-color:#cfcfcf; }
    .obtn.danger:hover { background:#6a2626; border-color:#401414; color:#ffe0e0; }

    /* Narrower cabinet aspect ratios: the content box is far narrower than the
       640-wide landscape design, so shrink the CONTROLS type until no row wraps
       and tighten the section rhythm + padding so every group stays inside the
       (also shorter) frame. The square ratio keeps two control columns; portrait
       is too narrow for two columns of key + label, so its list drops to one and
       the sound buttons regrid two-up. */
    @container (max-width: 520px) {
      .panel h3 { padding-bottom:1px; }
      /* one narrow column: each row spans the full width, so no key + label pair
         wraps, and the smaller type keeps all twelve rows inside the frame. */
      .panel .controls-grid { grid-auto-flow:row; grid-template-columns:1fr;
                              grid-template-rows:none; font-size:8.5px; }
      .panel .krow { grid-template-columns:48px 1fr; gap:6px; }
      .panel .obtn { font-size:10px; padding:3px 8px; }
      /* long labels ("Sound Blaster") need more than a quarter of the narrow
         panel, so the four sound buttons regrid two-up. */
      .panel .ctl.sound { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    }

    /* transient message over the content area (booting) */
    #content .overlay {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      text-align:center; padding:22px; box-sizing:border-box; z-index:5;
      background:rgba(0,0,0,0.9); color:#dcdcdc;
      font-family:var(--silk); font-size:12px; line-height:1.7;
    }
    #content .overlay.hidden { display:none; }


    /* Upload (first-run) panel shares the light face. */
    #panel-upload { display:flex; align-items:center; justify-content:center; text-align:center; }
    #panel-upload .inner { max-width:88%; }
    #panel-upload .title { font-family:var(--silk); font-weight:400; color:#fff; font-size:22px;
      letter-spacing:2px; margin-top:24px; margin-bottom:12px; }
    #panel-upload .subtitle { font-family:var(--silk); color:var(--panel-dim); font-size:11px;
                              letter-spacing:1px; margin-bottom:16px; }
    #panel-upload p { margin:0 0 18px; color:#DDDDDD; line-height:1.7; }
    #panel-upload .status { margin-top:16px; min-height:30px; }
    #panel-upload .hint { margin-top:12px; color:var(--panel-dim); font-size:11px; }
    .bigbtn { margin-top:16px; font-family:var(--silk); font-weight:400; font-size:13px; white-space:nowrap;
              background:#2a2a2a; color:#fff; border:1px solid #111; padding:8px 20px; cursor:pointer; }
    .bigbtn:hover { background:#1c1c1c; border-color:#000; }

    /* Too-small-viewport notice: replaces the whole interface with one auto-fitted line
       (JS sizes it to always fit the viewport, at any size).  Slightly-darker-than-white gray. */
    #toosmall { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
                padding:32px; box-sizing:border-box; background:var(--surface); z-index:20; }
    body.toosmall #toosmall { display:flex; }
    #toosmall span { font-family:var(--silk); font-weight:400; color:#cccccc; text-align:center;
                     line-height:1; overflow-wrap:normal; word-break:normal; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="cabinet">
      <svg id="bevel"></svg>
      <div id="tabbar">
        
      </div>
      <div id="content">
        <canvas id="screen"></canvas>
      </div>
    </div>
  </div>
  <div id="toosmall">
    <span>Browser window/<wbr>viewport is too small to display this interface</span>
  </div>

  <script>
/* Layout + bevel.  The interface is authored at a fixed "design" size (#cabinet with
   #content = 640x400) and uniformly scaled with CSS `zoom` to fit the viewport, so tabs,
   content, bevel and panels always stay in proportion -- one monotonic scale, no reflow.
   Below a minimum legible scale the whole interface is replaced by a single auto-fitted
   notice line.  The bevel is a child of #cabinet drawn in design coordinates, so `zoom`
   scales it along with everything else. */
(function () {
  var SVGNS = "http://www.w3.org/2000/svg";
  var SURFACE = "#1f1f1f", DARK = "#060606", LIGHT = "#4a4a4a";
  var BEVEL = 9;            // must match --bevel
  var K_MIN = 0.58;        // below this the interface is too small -> show the notice
  var MARGIN = 32 * 1.666666667;  // gap between cabinet and viewport edge (~53.3)

  function grad(id, x1, y1, x2, y2, inner) {
    return '<linearGradient id="' + id + '" gradientUnits="userSpaceOnUse" '
      + 'x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '">'
      + '<stop offset="0" stop-color="' + inner + '"/>'
      + '<stop offset="1" stop-color="' + SURFACE + '"/></linearGradient>';
  }
  function poly(id, pts) {
    return '<polygon points="' + pts.map(function (p) { return p[0] + "," + p[1]; }).join(" ")
      + '" fill="url(#' + id + ')"/>';
  }

  /* Draw the sunken L-frame in #cabinet design coordinates.  Must be called while zoom=1 so the
     offset* reads are design px; `zoom` then scales the resulting SVG with the cabinet. */

    var cab = document.getElementById("cabinet"), svg = document.getElementById("bevel");
    var tabbar = document.getElementById("tabbar"), content = document.getElementById("content");
    if (!cab || !svg || !tabbar || !content) return;
    var CW = cab.offsetWidth, CH = cab.offsetHeight;
    if (CW < 4 || CH < 4) return;
    var t = BEVEL;
    var cw = content.offsetWidth, ch = content.offsetHeight;
    var TH = tabbar.offsetHeight;
    var xL = content.offsetLeft, yS = content.offsetTop;
    var yT = TH ? tabbar.offsetTop : yS;
    var tabsW = TH ? Math.min(tabbar.offsetWidth, cw) : 0;
    var yB = yS + ch, xTR = xL + tabsW, xR = xL + cw;

      + grad("g3", 0, yS, 0, yS - t, DARK)          // top-of-screen (up, dark)
      + grad("g4", xR, 0, xR + t, 0, LIGHT)         // right-of-screen (right, light)
      + grad("g5", 0, yB, 0, yB + t, LIGHT)         // bottom (down, light)
      + grad("g6", xL, 0, xL - t, 0, DARK);         // left (left, dark)

  /* Size the too-small notice to fit within 2/3 of the viewport (binary search). */
  function fitMessage() {
    var span = document.querySelector("#toosmall span");
    if (!span) return;
    var availW = Math.max(40, innerWidth * 2 / 3), availH = Math.max(24, innerHeight * 2 / 3);
    span.style.width = availW + "px";
    var lo = 5, hi = 240, best = 5;

      var mid = (lo + hi) / 2;
